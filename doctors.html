<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Curalis — Doctors</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/doctors.css"/>
</head>
<body>

  <!--Nav Bar-->
  <nav class="sidebar">
    <div class="sidebar-logo">
      <img src="assets/img/logo.png" alt="Curalis"/>
    </div>
    <ul class="nav-links">
      <li class="nav-item" data-page="home.html" title="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
          <path d="M9 21V12h6v9"/>
        </svg>
        <span>Home</span>
      </li>
      <li class="nav-item" data-page="doctors.html" title="Doctors">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        <span>Doctors</span>
      </li>
      <li class="nav-item" data-page="bookings.html" title="Bookings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <path d="M16 2v4M8 2v4M3 10h18"/>
          <path d="M12 14v4M10 16h4"/>
        </svg>
        <span>Bookings</span>
      </li>
      <li class="nav-item" data-page="about.html" title="About">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-info-icon lucide-info">
          <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
        </svg>
        <span>About</span>
      </li>
    </ul>
    <div class="profile-wrap" id="profileWrap">
      <img src="assets/img/profile.png" alt="Profile" class="profile-pic" id="profilePic"/>
      <div class="profile-menu" id="profileMenu">
        <button class="profile-menu-item" id="btnEditCard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          Edit Health Card
        </button>
        <button class="profile-menu-item" id="btnLanguages">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/>
            <path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>
          </svg>
          Languages
        </button>
        <button class="profile-menu-item logout" id="btnLogout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Logout
        </button>
      </div>
    </div>
  </nav>
  <main class="main">

    <header class="topbar">
      <h1 class="page-title">Doctors</h1>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <line x1="16.5" y1="16.5" x2="22" y2="22"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search doctors, specialties…"/>
      </div>
      <button class="filter-btn" id="filterBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="4" y1="6"  x2="20" y2="6"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
          <line x1="11" y1="18" x2="13" y2="18"/>
        </svg>
        Filter
      </button>
    </header>

    <!--Filter-->
    <div class="filter-panel" id="filterPanel">
      <div class="filter-section">
        <p class="filter-label">Specialty</p>
        <div class="filter-chips">
          <button class="chip active" data-filter="specialty" data-value="all">All</button>
          <button class="chip" data-filter="specialty" data-value="Cardiologist">Cardio</button>
          <button class="chip" data-filter="specialty" data-value="Neurologist">Neuro</button>
          <button class="chip" data-filter="specialty" data-value="Dermatologist">Derma</button>
          <button class="chip" data-filter="specialty" data-value="Dentist">Dental</button>
          <button class="chip" data-filter="specialty" data-value="Orthopedist">Ortho</button>
          <button class="chip" data-filter="specialty" data-value="Pediatrician">Pediatric</button>
        </div>
      </div>
      <div class="filter-section">
        <p class="filter-label">Max Price <span id="priceVal">$100</span></p>
        <input type="range" min="50" max="100" value="100" step="5" id="priceRange" class="filter-range"/>
      </div>
      <div class="filter-section">
        <p class="filter-label">Min Experience <span id="expVal">0 yrs</span></p>
        <input type="range" min="0" max="12" value="0" step="1" id="expRange" class="filter-range"/>
      </div>
      <button class="chip" id="clearFilters">Clear All</button>
    </div>

    <div class="content">

      <div id="defaultView">
        <section class="section">
          <div class="section-header">
            <h2>Available Today</h2>
            
          </div>
          <div class="cards-grid" id="availableGrid"></div>
        </section>
        <br><br>
        <section class="section">
          <h2>Top Doctors</h2>
          <div class="cards-grid" id="topGrid"></div>
        </section>
      </div>

      <div id="filteredView" style="display:none;">
        <div class="cards-grid" id="filteredGrid"></div>
        <p class="no-results" id="filteredEmpty" style="display:none;">No doctors match your search.</p>
      </div>

    </div>
  </main>

  <script src="assets/js/doctors.js"></script>
</body>
</html>
